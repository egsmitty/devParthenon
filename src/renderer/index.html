<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';"
  />
  <title>Dev Parthenon</title>
  <link rel="stylesheet" href="./fonts.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Ambient atmosphere: light beams, drifting motes, vignette -->
  <div id="atmosphere" aria-hidden="true">
    <div class="beam beam-1"></div>
    <div class="beam beam-2"></div>
    <span class="mote"></span><span class="mote"></span><span class="mote"></span>
    <span class="mote"></span><span class="mote"></span><span class="mote"></span>
    <span class="mote"></span><span class="mote"></span><span class="mote"></span>
    <span class="mote"></span><span class="mote"></span><span class="mote"></span>
    <div class="vignette"></div>
  </div>

  <div id="titlebar">
    <div class="titlebar-drag">
      <span class="titlebar-mark">&#9650;</span>
      <span class="titlebar-title">Dev Parthenon</span>
    </div>
    <div class="titlebar-controls">
      <button id="btn-help" class="tb-btn tb-help" title="Keys &amp; controls (?)" aria-label="Keyboard shortcuts">?</button>
      <button id="btn-min" class="tb-btn" title="Minimize" aria-label="Minimize">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5" /></svg>
      </button>
      <button id="btn-max" class="tb-btn" title="Maximize" aria-label="Maximize">
        <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" /></svg>
      </button>
      <button id="btn-close" class="tb-btn tb-close" title="Close" aria-label="Close">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" /><line x1="10" y1="0" x2="0" y2="10" /></svg>
      </button>
    </div>
  </div>

  <div id="layout">
    <main id="temple-pane" class="carved-panel">
      <header id="temple-header">
        <h1>Dev Parthenon</h1>
        <div id="temple-stats"></div>
      </header>
      <div id="temple-svg-host"></div>
      <div id="temple-tip" role="tooltip" hidden></div>
      <footer id="temple-footer">
        <button id="btn-settings" class="ghost-btn">&#9881; Settings</button>
        <button id="btn-chronicle" class="ghost-btn">Chronicle</button>
        <button id="btn-review" class="ghost-btn gold-btn">Review weak spots</button>
        <button id="btn-reset" class="ghost-btn">Reset progress</button>
      </footer>
    </main>
  </div>

  <!-- Book-spine tab: opens the Codex of Jargon -->
  <button id="codex-tab" aria-label="Open the Codex of Jargon" aria-expanded="false">
    <svg class="codex-tab-book" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 3h6a2 2 0 0 1 2 2v15a2 2 0 0 0-2-2H4z" />
      <path d="M20 3h-6a2 2 0 0 0-2 2v15a2 2 0 0 1 2-2h6z" />
    </svg>
    <span class="codex-tab-label">CODEX</span>
  </button>

  <!-- The Codex: a great open book — two parchment pages, a gilded spine -->
  <div id="codex" hidden>
    <div class="codex-backdrop" data-action="close"></div>
    <section class="codex-book" role="dialog" aria-modal="true" aria-label="Codex of Jargon">
      <button class="codex-close" data-action="close" aria-label="Close the codex and return to the temple">
        <span class="return-glyph" aria-hidden="true">&#8617;</span> Return
      </button>
      <header class="book-headband">
        <div class="codex-title">
          <h2>Codex of Jargon</h2>
          <p class="codex-sub">The developer's lexicon, illuminated.</p>
        </div>
        <input
          id="codex-search"
          type="search"
          placeholder="Search the lexicon (SSR, CORS, ORM&hellip;)"
          autocomplete="off"
        />
      </header>
      <div class="book-spread">
        <div class="book-page book-page-left" id="codex-left"></div>
        <div class="book-spine" id="codex-statues" aria-hidden="true"></div>
        <div class="book-page book-page-right" id="codex-right"></div>
      </div>
    </section>
  </div>

  <div id="modal-root" role="dialog" aria-modal="true" aria-label="Learning module" hidden></div>
  <div id="settings-root" role="dialog" aria-modal="true" aria-label="Settings" hidden></div>
  <div id="welcome-root" role="dialog" aria-modal="true" aria-label="Welcome" hidden></div>
  <div id="chronicle-root" role="dialog" aria-modal="true" aria-label="The Chronicle" hidden></div>
  <div id="help-root" role="dialog" aria-modal="true" aria-label="Keys and controls" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
